[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "extjson"
version = "0.2.0"
description = "Extended JSON serialization library supporting main BSON types (datetime, bytes, UUID, Decimal, …)"
authors = [{name = "Pascal Chambon"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["json", "extended json", "extjson", "bson", "mongodb", "serialization", "datetime", "uuid", "decimal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/pakal/extjson"
Changelog = "https://github.com/pakal/extjson/blob/main/CHANGELOG.md"

[tool.poetry]
packages = [{include = "extjson.py"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytz = ">=2021.1"
ruff = ">=0.4"
tox = ">=4.0"
pytest-cov = ">=5.0"

[tool.coverage.run]
branch = true
source = ["extjson"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "except ImportError:",  # Micropython fallbacks
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.tox]
env_list = ["3.11", "3.12", "3.13", "3.14"]

[tool.tox.env_run_base]
description = "Run pytest under {base_python}"
deps = ["pytest>=7.0", "pytz>=2021.1"]
commands = [["pytest", "test_extjson.py", "-v"]]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "double"
